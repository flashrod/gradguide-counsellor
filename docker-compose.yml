services:
  db:
    image: postgres:16-alpine
    container_name: gradguide-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gradguide
      POSTGRES_PASSWORD: gradguide
      POSTGRES_DB: gradguide
    ports:
      - "5432:5432"
    volumes:
      - gradguide-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradguide -d gradguide"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gradguide-pgdata:
